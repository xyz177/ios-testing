name: Build Jailbreak DEB (Roothide)

on:
  workflow_dispatch:
    inputs:
      package_name:
        description: 'Package identifier'
        required: true
        default: 'com.ikarwan.ytkplus'
      package_version:
        description: 'Package version'
        required: true
        default: '1.0.0'
      maintainer:
        description: 'Maintainer name and email'
        required: true
        default: 'Your Name <email@example.com>'
      description:
        description: 'Package description'
        required: true
        default: 'YTKPlus tweak for YouTube'
      tweak_name:
        description: 'Main tweak name'
        required: true
        default: 'YTKPlus'
      bundle_zips:
        description: 'Space-separated list of bundle zip files'
        required: true
        default: 'YTKPlus.bundle.zip'
      bundle_id:
        description: 'Bundle ID to inject into'
        required: true
        default: 'com.google.ios.youtube'

jobs:
  build:
    runs-on: macos-latest
    
    steps:
    - name: Checkout code
      uses: actions/checkout@v4

    - name: Install dpkg
      run: brew install dpkg

    - name: Set environment variables
      run: |
        PACKAGE_NAME="${{ github.event.inputs.package_name }}"
        PACKAGE_VERSION="${{ github.event.inputs.package_version }}"
        MAINTAINER="${{ github.event.inputs.maintainer }}"
        DESCRIPTION="${{ github.event.inputs.description }}"
        TWEAK_NAME="${{ github.event.inputs.tweak_name }}"
        BUNDLE_ZIPS="${{ github.event.inputs.bundle_zips }}"
        BUNDLE_ID="${{ github.event.inputs.bundle_id }}"
        
        if [ -z "$PACKAGE_NAME" ]; then PACKAGE_NAME="com.ikarwan.ytkplus"; fi
        if [ -z "$PACKAGE_VERSION" ]; then PACKAGE_VERSION="1.0.0"; fi
        if [ -z "$MAINTAINER" ]; then MAINTAINER="Your Name <email@example.com>"; fi
        if [ -z "$DESCRIPTION" ]; then DESCRIPTION="YTKPlus tweak for YouTube"; fi
        if [ -z "$TWEAK_NAME" ]; then TWEAK_NAME="YTKPlus"; fi
        if [ -z "$BUNDLE_ZIPS" ]; then BUNDLE_ZIPS="YTKPlus.bundle.zip"; fi
        if [ -z "$BUNDLE_ID" ]; then BUNDLE_ID="com.google.ios.youtube"; fi
        
        TAG_NAME="${TWEAK_NAME}-${PACKAGE_VERSION}"
        
        echo "PACKAGE_NAME=${PACKAGE_NAME}" >> $GITHUB_ENV
        echo "PACKAGE_VERSION=${PACKAGE_VERSION}" >> $GITHUB_ENV
        echo "MAINTAINER=${MAINTAINER}" >> $GITHUB_ENV
        echo "DESCRIPTION=${DESCRIPTION}" >> $GITHUB_ENV
        echo "TWEAK_NAME=${TWEAK_NAME}" >> $GITHUB_ENV
        echo "TAG_NAME=${TAG_NAME}" >> $GITHUB_ENV
        echo "BUNDLE_ZIPS=${BUNDLE_ZIPS}" >> $GITHUB_ENV
        echo "BUNDLE_ID=${BUNDLE_ID}" >> $GITHUB_ENV
        echo "BUILD_DIR=$(pwd)/build" >> $GITHUB_ENV
        echo "DEB_DIR=$(pwd)/debs" >> $GITHUB_ENV
        echo "EXTRACT_DIR=$(pwd)/extracted" >> $GITHUB_ENV
        echo "DYLIB_EXTRACT_DIR=$(pwd)/dylib_extracted" >> $GITHUB_ENV

    - name: Create build directories
      run: |
        mkdir -p $BUILD_DIR
        mkdir -p $DEB_DIR
        mkdir -p $EXTRACT_DIR
        mkdir -p $DYLIB_EXTRACT_DIR
        mkdir -p $BUILD_DIR/roothide/DEBIAN
        mkdir -p $BUILD_DIR/roothide/var/jb/Library/MobileSubstrate/DynamicLibraries
        mkdir -p $BUILD_DIR/roothide/var/jb/Library/PreferenceBundles

    - name: Auto-detect ALL dylib files (including .dylib.zip)
      run: |
        echo "📦 Scanning for dylib files..."
        DYLIB_COUNT=0
        
        # First, extract any .dylib.zip files
        for zip in *.dylib.zip; do
          if [ -f "$zip" ]; then
            echo "  Found zipped dylib: $zip"
            echo "  Extracting: $zip"
            unzip -q "$zip" -d "$DYLIB_EXTRACT_DIR/"
            echo "  ✅ Extracted: $zip"
          fi
        done
        
        # Copy extracted dylibs from zip
        for dylib in "$DYLIB_EXTRACT_DIR"/*.dylib; do
          if [ -f "$dylib" ]; then
            DYLIB_NAME=$(basename "$dylib")
            echo "  Found in zip: $DYLIB_NAME"
            cp "$dylib" $BUILD_DIR/roothide/var/jb/Library/MobileSubstrate/DynamicLibraries/
            DYLIB_COUNT=$((DYLIB_COUNT + 1))
          fi
        done
        
        # Also check for direct .dylib files (not zipped)
        for dylib in *.dylib; do
          if [ -f "$dylib" ]; then
            # Skip if it's a .dylib.zip (the loop above handles zips)
            if [[ "$dylib" != *.dylib.zip ]]; then
              echo "  Found direct dylib: $dylib"
              cp "$dylib" $BUILD_DIR/roothide/var/jb/Library/MobileSubstrate/DynamicLibraries/
              DYLIB_COUNT=$((DYLIB_COUNT + 1))
            fi
          fi
        done
        
        if [ $DYLIB_COUNT -eq 0 ]; then
          echo "  ❌ ERROR: No dylib files found!"
          echo "  Available files in repository:"
          ls -la
          exit 1
        fi
        
        echo "DYLIB_COUNT=$DYLIB_COUNT" >> $GITHUB_ENV
        echo ""
        echo "📊 Total dylib files found: $DYLIB_COUNT"
        echo "📂 Dylib files in build:"
        ls -la $BUILD_DIR/roothide/var/jb/Library/MobileSubstrate/DynamicLibraries/

    - name: Extract and copy bundle files
      run: |
        echo "📦 Extracting bundle zip files..."
        BUNDLE_COUNT=0
        
        for zip in $BUNDLE_ZIPS; do
          if [ -f "$zip" ]; then
            echo "  Extracting: $zip"
            unzip -q "$zip" -d $EXTRACT_DIR/
            echo "  ✅ Extracted: $zip"
          fi
        done
        
        echo ""
        echo "📦 Copying bundle files..."
        for bundle in $EXTRACT_DIR/*.bundle; do
          if [ -d "$bundle" ]; then
            BUNDLE_NAME=$(basename "$bundle")
            cp -r "$bundle" $BUILD_DIR/roothide/var/jb/Library/PreferenceBundles/
            echo "  ✅ Copied bundle: $BUNDLE_NAME"
            BUNDLE_COUNT=$((BUNDLE_COUNT + 1))
          fi
        done
        
        echo "BUNDLE_COUNT=$BUNDLE_COUNT" >> $GITHUB_ENV

    - name: Generate plist files for each dylib
      run: |
        echo "📦 Generating plist files with bundle ID: $BUNDLE_ID"
        PLIST_COUNT=0
        
        for dylib in $BUILD_DIR/roothide/var/jb/Library/MobileSubstrate/DynamicLibraries/*.dylib; do
          if [ -f "$dylib" ]; then
            DYLIB_NAME=$(basename "$dylib" .dylib)
            PLIST_FILE="${DYLIB_NAME}.plist"
            
            echo "  Generating: $PLIST_FILE"
            
            echo '<?xml version="1.0" encoding="UTF-8"?>' > "$PLIST_FILE"
            echo '<!DOCTYPE plist PUBLIC "-//Apple//DTD PLIST 1.0//EN" "http://www.apple.com/DTDs/PropertyList-1.0.dtd">' >> "$PLIST_FILE"
            echo '<plist version="1.0">' >> "$PLIST_FILE"
            echo '<dict>' >> "$PLIST_FILE"
            echo '	<key>Filter</key>' >> "$PLIST_FILE"
            echo '	<dict>' >> "$PLIST_FILE"
            echo '		<key>Bundles</key>' >> "$PLIST_FILE"
            echo '		<array>' >> "$PLIST_FILE"
            echo "			<string>${BUNDLE_ID}</string>" >> "$PLIST_FILE"
            echo '		</array>' >> "$PLIST_FILE"
            echo '	</dict>' >> "$PLIST_FILE"
            echo '</dict>' >> "$PLIST_FILE"
            echo '</plist>' >> "$PLIST_FILE"
            
            cp "$PLIST_FILE" $BUILD_DIR/roothide/var/jb/Library/MobileSubstrate/DynamicLibraries/
            echo "  ✅ Generated: $PLIST_FILE"
            PLIST_COUNT=$((PLIST_COUNT + 1))
          fi
        done
        
        echo "PLIST_COUNT=$PLIST_COUNT" >> $GITHUB_ENV

    - name: Show package contents
      run: |
        echo "📊 Package summary:"
        echo "  - Dylib files: $DYLIB_COUNT"
        echo "  - Bundle files: $BUNDLE_COUNT"
        echo "  - Plist files: $PLIST_COUNT"
        echo ""
        echo "📂 Full package contents:"
        find $BUILD_DIR/roothide -type f | sed "s|$BUILD_DIR/roothide||" | sort

    - name: Create DEBIAN control file
      run: |
        cat > $BUILD_DIR/roothide/DEBIAN/control << EOF
        Package: $PACKAGE_NAME
        Version: $PACKAGE_VERSION
        Section: Tweaks
        Priority: optional
        Architecture: iphoneos-arm64e
        Maintainer: $MAINTAINER
        Depends: ellekit (>= 1.0.0)
        Description: $DESCRIPTION
        Name: $TWEAK_NAME
        Author: $MAINTAINER
        Installed-Size: 0
        EOF

    - name: Create postinst script
      run: |
        cat > $BUILD_DIR/roothide/DEBIAN/postinst << 'EOF'
        #!/bin/sh
        chmod 755 /var/jb/Library/MobileSubstrate/DynamicLibraries/*.dylib
        chmod 755 /var/jb/Library/PreferenceBundles/*.bundle
        killall -9 SpringBoard
        exit 0
        EOF
        chmod 755 $BUILD_DIR/roothide/DEBIAN/postinst

    - name: Build DEB package
      run: |
        dpkg-deb -b $BUILD_DIR/roothide $DEB_DIR/${TWEAK_NAME}_${PACKAGE_VERSION}_iphoneos-arm64e.deb

    - name: List built packages
      run: |
        echo "📦 Built packages:"
        ls -la $DEB_DIR/
        echo ""
        echo "📊 Package statistics:"
        echo "  - Dylibs included: $DYLIB_COUNT"
        echo "  - Bundles included: $BUNDLE_COUNT"
        echo "  - Plists generated: $PLIST_COUNT"
        echo "  - Total package size: $(du -sh $DEB_DIR/ | cut -f1)"

    - name: Create Release
      uses: softprops/action-gh-release@v1
      with:
        name: ${{ env.TWEAK_NAME }} v${{ env.PACKAGE_VERSION }} (Roothide)
        tag_name: ${{ env.TAG_NAME }}
        draft: false
        prerelease: false
        generate_release_notes: false
        files: |
          ${{ env.DEB_DIR }}/*.deb
        body: ""
      env:
        GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}