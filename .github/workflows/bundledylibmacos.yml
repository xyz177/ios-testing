name: Build Jailbreak DEB (Roothide arm64e)

on:
  push:
    branches: [ main, master ]
    paths-ignore:
      - '*.dylib'
      - '*.zip'
      - '*.bundle'
  workflow_dispatch:
    inputs:
      package_name:
        description: 'Package identifier (e.g., com.yourrepo.ytkplus)'
        required: true
        default: 'com.ikarwan.ytkplus'
      package_version:
        description: 'Package version (e.g., 1.0.0)'
        required: true
        default: '1.0.0'
      maintainer:
        description: 'Maintainer name and email'
        required: true
        default: 'Your Name <email@example.com>'
      description:
        description: 'Package description'
        required: true
        default: 'YTKPlus tweak for YouTube'
      tweak_name:
        description: 'Main tweak name'
        required: true
        default: 'YTKPlus'
      dylib_files:
        description: 'Space-separated list of dylib files or zip files'
        required: true
        default: 'YTKPlus.dylib'
      bundle_zips:
        description: 'Space-separated list of bundle zip files'
        required: true
        default: 'YTKPlus.bundle.zip'
      bundle_id:
        description: 'Bundle ID to inject into'
        required: true
        default: 'com.google.ios.youtube'

jobs:
  build:
    runs-on: macos-latest
    
    steps:
    - name: Checkout code
      uses: actions/checkout@v4

    - name: Install dpkg
      run: |
        echo "📦 Installing dpkg..."
        brew install dpkg
        echo "✅ dpkg installed"
        dpkg --version

    - name: Set environment variables
      run: |
        PACKAGE_NAME="${{ github.event.inputs.package_name }}"
        PACKAGE_VERSION="${{ github.event.inputs.package_version }}"
        MAINTAINER="${{ github.event.inputs.maintainer }}"
        DESCRIPTION="${{ github.event.inputs.description }}"
        TWEAK_NAME="${{ github.event.inputs.tweak_name }}"
        DYLIB_FILES="${{ github.event.inputs.dylib_files }}"
        BUNDLE_ZIPS="${{ github.event.inputs.bundle_zips }}"
        BUNDLE_ID="${{ github.event.inputs.bundle_id }}"
        
        if [ -z "$PACKAGE_NAME" ]; then PACKAGE_NAME="com.ikarwan.ytkplus"; fi
        if [ -z "$PACKAGE_VERSION" ]; then PACKAGE_VERSION="1.0.0"; fi
        if [ -z "$MAINTAINER" ]; then MAINTAINER="Your Name <email@example.com>"; fi
        if [ -z "$DESCRIPTION" ]; then DESCRIPTION="YTKPlus tweak for YouTube"; fi
        if [ -z "$TWEAK_NAME" ]; then TWEAK_NAME="YTKPlus"; fi
        if [ -z "$DYLIB_FILES" ]; then DYLIB_FILES="YTKPlus.dylib"; fi
        if [ -z "$BUNDLE_ZIPS" ]; then BUNDLE_ZIPS="YTKPlus.bundle.zip"; fi
        if [ -z "$BUNDLE_ID" ]; then BUNDLE_ID="com.google.ios.youtube"; fi
        
        TAG_NAME="${TWEAK_NAME}-${PACKAGE_VERSION}"
        
        echo "PACKAGE_NAME=${PACKAGE_NAME}" >> $GITHUB_ENV
        echo "PACKAGE_VERSION=${PACKAGE_VERSION}" >> $GITHUB_ENV
        echo "MAINTAINER=${MAINTAINER}" >> $GITHUB_ENV
        echo "DESCRIPTION=${DESCRIPTION}" >> $GITHUB_ENV
        echo "TWEAK_NAME=${TWEAK_NAME}" >> $GITHUB_ENV
        echo "TAG_NAME=${TAG_NAME}" >> $GITHUB_ENV
        echo "DYLIB_FILES=${DYLIB_FILES}" >> $GITHUB_ENV
        echo "BUNDLE_ZIPS=${BUNDLE_ZIPS}" >> $GITHUB_ENV
        echo "BUNDLE_ID=${BUNDLE_ID}" >> $GITHUB_ENV
        echo "BUILD_DIR=$(pwd)/build" >> $GITHUB_ENV
        echo "DEB_DIR=$(pwd)/debs" >> $GITHUB_ENV
        echo "EXTRACT_DIR=$(pwd)/extracted" >> $GITHUB_ENV
        echo "DYLIB_EXTRACT_DIR=$(pwd)/dylib_extracted" >> $GITHUB_ENV
        
        echo "📊 Configuration:"
        echo "  Package Name: ${PACKAGE_NAME}"
        echo "  Package Version: ${PACKAGE_VERSION}"
        echo "  Tweak Name: ${TWEAK_NAME}"
        echo "  Tag Name: ${TAG_NAME}"
        echo "  Architecture: iphoneos-arm64e (Roothide)"
        echo "  Bundle ID: ${BUNDLE_ID}"

    - name: Create build directories
      run: |
        mkdir -p $BUILD_DIR
        mkdir -p $DEB_DIR
        mkdir -p $EXTRACT_DIR
        mkdir -p $DYLIB_EXTRACT_DIR
        mkdir -p $BUILD_DIR/roothide/DEBIAN

    - name: List files (debug)
      run: |
        echo "📂 Files in repository:"
        ls -la
        echo ""
        echo "📦 DYLIB_FILES: $DYLIB_FILES"
        echo "📦 BUNDLE_ZIPS: $BUNDLE_ZIPS"
        echo ""
        echo "📦 Checking if files exist:"
        IFS=' ' read -ra DYLIB_ARRAY <<< "$DYLIB_FILES"
        for item in "${DYLIB_ARRAY[@]}"; do
          if [ -f "$item" ]; then echo "  ✅ $item exists"; else echo "  ❌ $item NOT found"; fi
        done
        IFS=' ' read -ra ZIP_ARRAY <<< "$BUNDLE_ZIPS"
        for zip in "${ZIP_ARRAY[@]}"; do
          if [ -f "$zip" ]; then echo "  ✅ $zip exists"; else echo "  ❌ $zip NOT found"; fi
        done

    - name: Extract zipped dylib files
      run: |
        echo "📦 Extracting zipped dylib files..."
        
        IFS=' ' read -ra DYLIB_ARRAY <<< "$DYLIB_FILES"
        
        for item in "${DYLIB_ARRAY[@]}"; do
          if [[ "$item" == *.zip ]] || [[ "$item" == *.ZIP ]]; then
            if [ -f "$item" ]; then
              echo "  Extracting dylib from: $item"
              unzip -q "$item" -d "$DYLIB_EXTRACT_DIR/"
              echo "  ✅ Extracted: $item"
            else
              echo "  ⚠️  WARNING: $item not found!"
            fi
          fi
        done
        
        echo ""
        echo "📂 Extracted dylib files:"
        find "$DYLIB_EXTRACT_DIR" -name "*.dylib" 2>/dev/null | sed 's|.*/||' || echo "  (none)"

    - name: Copy dylib files (Roothide)
      run: |
        mkdir -p $BUILD_DIR/roothide/Library/MobileSubstrate/DynamicLibraries
        
        echo "📦 Copying dylib files..."
        DYLIB_COUNT=0
        
        IFS=' ' read -ra DYLIB_ARRAY <<< "$DYLIB_FILES"
        
        for dylib in "${DYLIB_ARRAY[@]}"; do
          if [[ "$dylib" == *.zip ]] || [[ "$dylib" == *.ZIP ]]; then
            continue
          fi
          
          if [ -f "$dylib" ]; then
            cp "$dylib" $BUILD_DIR/roothide/Library/MobileSubstrate/DynamicLibraries/
            echo "  ✅ Copied: $dylib"
            DYLIB_COUNT=$((DYLIB_COUNT + 1))
          else
            echo "  ⚠️  WARNING: $dylib not found!"
          fi
        done
        
        for dylib in "$DYLIB_EXTRACT_DIR"/*.dylib; do
          if [ -f "$dylib" ]; then
            DYLIB_NAME=$(basename "$dylib")
            cp "$dylib" $BUILD_DIR/roothide/Library/MobileSubstrate/DynamicLibraries/
            echo "  ✅ Copied from zip: $DYLIB_NAME"
            DYLIB_COUNT=$((DYLIB_COUNT + 1))
          fi
        done
        
        if [ $DYLIB_COUNT -eq 0 ]; then
          echo "  ❌ ERROR: No dylib files found!"
          exit 1
        fi
        
        echo "DYLIB_COUNT=${DYLIB_COUNT}" >> $GITHUB_ENV

    - name: Copy bundle files (Roothide)
      run: |
        mkdir -p $BUILD_DIR/roothide/Library/PreferenceBundles
        
        echo "📦 Extracting bundle zip files..."
        
        IFS=' ' read -ra ZIP_ARRAY <<< "$BUNDLE_ZIPS"
        
        for zip in "${ZIP_ARRAY[@]}"; do
          if [ -z "$zip" ]; then
            echo "  ❌ ERROR: Bundle zip is empty!"
            exit 1
          fi
          
          if [ ! -f "$zip" ]; then
            echo "  ❌ ERROR: $zip not found!"
            exit 1
          fi
          
          echo "  Extracting: $zip"
          unzip -q "$zip" -d $EXTRACT_DIR/
          echo "  ✅ Extracted: $zip"
        done
        
        echo ""
        echo "📦 Copying bundle files..."
        BUNDLE_COUNT=0
        
        for bundle in $(find $EXTRACT_DIR -type d -name "*.bundle" 2>/dev/null); do
          BUNDLE_NAME=$(basename "$bundle")
          cp -r "$bundle" $BUILD_DIR/roothide/Library/PreferenceBundles/
          echo "  ✅ Copied bundle: $BUNDLE_NAME"
          BUNDLE_COUNT=$((BUNDLE_COUNT + 1))
        done
        
        echo "BUNDLE_COUNT=${BUNDLE_COUNT}" >> $GITHUB_ENV

    - name: Generate plist files
      run: |
        mkdir -p $BUILD_DIR/roothide/Library/MobileSubstrate/DynamicLibraries
        
        echo "📦 Generating plist files with bundle ID: $BUNDLE_ID"
        PLIST_COUNT=0
        
        for dylib in $BUILD_DIR/roothide/Library/MobileSubstrate/DynamicLibraries/*.dylib; do
          if [ -f "$dylib" ]; then
            DYLIB_NAME=$(basename "$dylib" .dylib)
            PLIST_FILE="${DYLIB_NAME}.plist"
            
            echo "  Generating: $PLIST_FILE"
            
            cat > "$PLIST_FILE" << EOF
<?xml version="1.0" encoding="UTF-8"?>
<!DOCTYPE plist PUBLIC "-//Apple//DTD PLIST 1.0//EN" "http://www.apple.com/DTDs/PropertyList-1.0.dtd">
<plist version="1.0">
<dict>
    <key>Filter</key>
    <dict>
        <key>Bundles</key>
        <array>
            <string>${BUNDLE_ID}</string>
        </array>
    </dict>
</dict>
</plist>
EOF
            
            cp "$PLIST_FILE" $BUILD_DIR/roothide/Library/MobileSubstrate/DynamicLibraries/
            echo "  ✅ Generated: $PLIST_FILE"
            PLIST_COUNT=$((PLIST_COUNT + 1))
          fi
        done
        
        echo "PLIST_COUNT=${PLIST_COUNT}" >> $GITHUB_ENV

    - name: Show package contents
      run: |
        echo "📊 Package summary:"
        echo "  - Tweak Name: $TWEAK_NAME"
        echo "  - Package Version: $PACKAGE_VERSION"
        echo "  - Architecture: iphoneos-arm64e (Roothide)"
        echo "  - Dylib files: $DYLIB_COUNT"
        echo "  - Bundle files: $BUNDLE_COUNT"
        echo "  - Plist files: $PLIST_COUNT"
        echo "  - Bundle ID: $BUNDLE_ID"
        echo ""
        echo "📂 Package contents:"
        find $BUILD_DIR/roothide -type f | sed "s|$BUILD_DIR/roothide||" | sort

    - name: Create DEBIAN control file
      run: |
        cat > $BUILD_DIR/roothide/DEBIAN/control << EOF
        Package: ${{ env.PACKAGE_NAME }}
        Version: ${{ env.PACKAGE_VERSION }}
        Section: Tweaks
        Priority: optional
        Architecture: iphoneos-arm64e
        Maintainer: ${{ env.MAINTAINER }}
        Depends: mobilesubstrate (>= 0.9.5000)
        Description: ${{ env.DESCRIPTION }}
        Name: ${{ env.TWEAK_NAME }}
        Author: ${{ env.MAINTAINER }}
        Installed-Size: $(du -sk $BUILD_DIR/roothide | cut -f1)
        EOF

    - name: Create postinst script
      run: |
        cat > $BUILD_DIR/roothide/DEBIAN/postinst << 'EOF'
        #!/bin/sh
        chmod 755 /Library/MobileSubstrate/DynamicLibraries/*.dylib 2>/dev/null || true
        chmod 755 /Library/PreferenceBundles/*.bundle 2>/dev/null || true
        killall -9 SpringBoard 2>/dev/null || true
        exit 0
        EOF
        chmod 755 $BUILD_DIR/roothide/DEBIAN/postinst

    - name: Build DEB package
      run: |
        dpkg-deb -b $BUILD_DIR/roothide $DEB_DIR/${TWEAK_NAME}_${PACKAGE_VERSION}_iphoneos-arm64e.deb

    - name: List built packages
      run: |
        echo "📦 Built packages:"
        ls -la $DEB_DIR/
        echo ""
        echo "📊 Package statistics:"
        echo "  - Tweak Name: $TWEAK_NAME"
        echo "  - Package Version: $PACKAGE_VERSION"
        echo "  - Architecture: iphoneos-arm64e (Roothide)"
        echo "  - Dylibs included: $DYLIB_COUNT"
        echo "  - Bundles included: $BUNDLE_COUNT"
        echo "  - Plists generated: $PLIST_COUNT"
        echo "  - Total package size: $(du -sh $DEB_DIR/ | cut -f1)"

    - name: Create Release
      uses: softprops/action-gh-release@v1
      with:
        name: ${{ env.TWEAK_NAME }} v${{ env.PACKAGE_VERSION }} (Roothide)
        tag_name: ${{ env.TAG_NAME }}
        draft: false
        prerelease: false
        generate_release_notes: false
        files: |
          ${{ env.DEB_DIR }}/*.deb
        body: |
          ## ${{ env.TWEAK_NAME }} v${{ env.PACKAGE_VERSION }}
          
          ### Architecture: arm64e (Roothide)
          
          This package is built for Roothide jailbreaks.
          
          ### Installation
          Install via Sileo or your preferred package manager.
      env:
        GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}