name: Build Jailbreak DEB (Ubuntu)

on:
  workflow_dispatch:
    inputs:
      tweak_name:
        description: 'Tweak name (e.g., YTKACE)'
        required: true
        default: 'YTKACE'
        type: string
      package_id:
        description: 'Package identifier (e.g., com.yourrepo.ytkace)'
        required: true
        default: 'com.dvntdm.ytlite'
        type: string
      version:
        description: 'Package version (e.g., 1.0.0)'
        required: true
        default: '5.2.2'
        type: string
      maintainer:
        description: 'Maintainer name'
        required: true
        default: 'ace'
        type: string
      description:
        description: 'Package description'
        required: true
        default: 'YTKACE tweak for YouTube'
        type: string
      bundle_id:
        description: 'Bundle ID to inject into (e.g., com.google.ios.youtube)'
        required: true
        default: 'com.google.ios.youtube'
        type: string
      dylib_files:
        description: 'Space-separated list of dylib files or zips (e.g., YTKACE.dylib libYTKPlus.dylib.zip)'
        required: true
        default: 'YTKACE.dylib'
        type: string
      exclude_plist:
        description: 'Space-separated list of dylib names to exclude from plist generation'
        required: false
        default: ''
        type: string
      bundle_zip:
        description: 'Bundle zip filename (e.g., YTKACE.bundle.zip)'
        required: true
        default: 'YTKACE.bundle.zip'
        type: string
      compression:
        description: 'Compression level (none, gzip, xz, bzip2, zstd)'
        required: true
        default: 'xz'
        type: choice
        options:
          - 'none'
          - 'gzip'
          - 'bzip2'
          - 'xz'
          - 'zstd'
      create_release:
        description: 'Create GitHub release?'
        required: true
        default: 'true'
        type: choice
        options:
          - 'true'
          - 'false'

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Install dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y dpkg-dev unzip
          # Install zstd if needed
          if [ "${{ github.event.inputs.compression }}" = "zstd" ]; then
            sudo apt-get install -y zstd
          fi

      - name: Check files exist
        run: |
          echo "📂 Checking files..."
          DYLIB_FILES="${{ github.event.inputs.dylib_files }}"
          for file in $DYLIB_FILES; do
            if [ -f "$file" ]; then
              echo "  ✅ $file exists"
            else
              echo "  ❌ $file NOT found!"
              ls -la
              exit 1
            fi
          done
          
          if [ -f "${{ github.event.inputs.bundle_zip }}" ]; then
            echo "  ✅ ${{ github.event.inputs.bundle_zip }} exists"
          else
            echo "  ❌ ${{ github.event.inputs.bundle_zip }} NOT found!"
            ls -la
            exit 1
          fi

      - name: Set environment variables
        run: |
          echo "TWEAK_NAME=${{ github.event.inputs.tweak_name }}" >> $GITHUB_ENV
          echo "PACKAGE_ID=${{ github.event.inputs.package_id }}" >> $GITHUB_ENV
          echo "VERSION=${{ github.event.inputs.version }}" >> $GITHUB_ENV
          echo "MAINTAINER=${{ github.event.inputs.maintainer }}" >> $GITHUB_ENV
          echo "DESCRIPTION=${{ github.event.inputs.description }}" >> $GITHUB_ENV
          echo "BUNDLE_ID=${{ github.event.inputs.bundle_id }}" >> $GITHUB_ENV
          echo "DYLIB_FILES=${{ github.event.inputs.dylib_files }}" >> $GITHUB_ENV
          echo "EXCLUDE_PLIST=${{ github.event.inputs.exclude_plist }}" >> $GITHUB_ENV
          echo "BUNDLE_ZIP=${{ github.event.inputs.bundle_zip }}" >> $GITHUB_ENV
          echo "COMPRESSION=${{ github.event.inputs.compression }}" >> $GITHUB_ENV
          echo "CREATE_RELEASE=${{ github.event.inputs.create_release }}" >> $GITHUB_ENV
          echo "RELEASE_TAG=${{ github.event.inputs.tweak_name }}-${{ github.event.inputs.version }}" >> $GITHUB_ENV

      - name: Extract dylibs if zipped
        run: |
          echo "📦 Processing dylib files..."
          DYLIB_FILES="${{ env.DYLIB_FILES }}"
          DYLIB_COUNT=0
          
          mkdir -p dylib_extracted
          
          for file in $DYLIB_FILES; do
            if [[ "$file" == *.zip ]] || [[ "$file" == *.ZIP ]]; then
              echo "  Extracting zipped dylib: $file"
              unzip -q "$file" -d dylib_extracted/
              DYLIB_COUNT=$((DYLIB_COUNT + 1))
            else
              echo "  Using direct dylib: $file"
              cp "$file" dylib_extracted/
              DYLIB_COUNT=$((DYLIB_COUNT + 1))
            fi
          done
          
          if [ -z "$(ls -A dylib_extracted/*.dylib 2>/dev/null)" ]; then
            echo "  ❌ No dylib files found!"
            exit 1
          fi
          
          echo "DYLIB_COUNT=$DYLIB_COUNT" >> $GITHUB_ENV

      - name: Generate plists for each dylib (with exclusions)
        run: |
          echo "📦 Generating plist files..."
          PLIST_COUNT=0
          SKIPPED_COUNT=0
          
          EXCLUDE_ARRAY=()
          if [ -n "${{ env.EXCLUDE_PLIST }}" ]; then
            IFS=' ' read -ra EXCLUDE_ARRAY <<< "${{ env.EXCLUDE_PLIST }}"
          fi
          
          for dylib in dylib_extracted/*.dylib; do
            if [ -f "$dylib" ]; then
              DYLIB_NAME=$(basename "$dylib" .dylib)
              
              SHOULD_SKIP=false
              for exclude in "${EXCLUDE_ARRAY[@]}"; do
                if [[ "$DYLIB_NAME" == "$exclude" ]]; then
                  SHOULD_SKIP=true
                  break
                fi
              done
              
              if [ "$SHOULD_SKIP" = true ]; then
                echo "  ⏭️  Skipping plist for: $DYLIB_NAME"
                SKIPPED_COUNT=$((SKIPPED_COUNT + 1))
              else
                PLIST_FILE="${DYLIB_NAME}.plist"
                echo "  Generating: $PLIST_FILE"
                
                cat > "$PLIST_FILE" << 'EOF'
          <?xml version="1.0" encoding="UTF-8"?>
          <!DOCTYPE plist PUBLIC "-//Apple//DTD PLIST 1.0//EN" "http://www.apple.com/DTDs/PropertyList-1.0.dtd">
          <plist version="1.0">
          <dict>
              <key>Filter</key>
              <dict>
                  <key>Bundles</key>
                  <array>
                      <string>com.google.ios.youtube</string>
                  </array>
              </dict>
          </dict>
          </plist>
          EOF
                
                PLIST_COUNT=$((PLIST_COUNT + 1))
              fi
            fi
          done
          
          echo "PLIST_COUNT=$PLIST_COUNT" >> $GITHUB_ENV
          echo "SKIPPED_COUNT=$SKIPPED_COUNT" >> $GITHUB_ENV

      - name: Extract bundle zip
        run: |
          echo "📦 Extracting bundle zip..."
          unzip -q "${{ env.BUNDLE_ZIP }}" -d .
          
          EXTRACTED_BUNDLE=$(find . -maxdepth 2 -type d -name "*.bundle" ! -path "./.*" | head -1)
          
          if [ -n "$EXTRACTED_BUNDLE" ]; then
            BUNDLE_DIR_NAME=$(basename "$EXTRACTED_BUNDLE")
            echo "  ✅ Found bundle: $BUNDLE_DIR_NAME"
            echo "BUNDLE_DIR_NAME=$BUNDLE_DIR_NAME" >> $GITHUB_ENV
          else
            echo "  ⚠️  No .bundle found!"
            ls -la
            exit 1
          fi

      - name: Build Rootless DEB
        run: |
          echo "📦 Building Rootless DEB with ${{ env.COMPRESSION }} compression..."
          
          mkdir -p ${{ env.TWEAK_NAME }}-rootless/DEBIAN
          mkdir -p ${{ env.TWEAK_NAME }}-rootless/var/jb/Library/MobileSubstrate/DynamicLibraries
          mkdir -p "${{ env.TWEAK_NAME }}-rootless/var/jb/Library/Application Support/${{ env.TWEAK_NAME }}"
          
          for dylib in dylib_extracted/*.dylib; do
            if [ -f "$dylib" ]; then
              cp "$dylib" ${{ env.TWEAK_NAME }}-rootless/var/jb/Library/MobileSubstrate/DynamicLibraries/
            fi
          done
          
          for plist in *.plist; do
            if [ -f "$plist" ]; then
              cp "$plist" ${{ env.TWEAK_NAME }}-rootless/var/jb/Library/MobileSubstrate/DynamicLibraries/
            fi
          done
          
          cp -r "${{ env.BUNDLE_DIR_NAME }}" "${{ env.TWEAK_NAME }}-rootless/var/jb/Library/Application Support/${{ env.TWEAK_NAME }}/"
          
          cat > ${{ env.TWEAK_NAME }}-rootless/DEBIAN/control << EOF
          Package: ${{ env.PACKAGE_ID }}.rootless
          Name: ${{ env.TWEAK_NAME }} (Rootless)
          Version: ${{ env.VERSION }}
          Architecture: iphoneos-arm64
          Description: ${{ env.DESCRIPTION }} - Rootless
          Maintainer: ${{ env.MAINTAINER }}
          Section: Tweaks
          Depends: mobilesubstrate (>= 0.9.5000)
          EOF
          
          cat > ${{ env.TWEAK_NAME }}-rootless/DEBIAN/postinst << 'EOF'
          #!/bin/sh
          chmod 755 /var/jb/Library/MobileSubstrate/DynamicLibraries/*.dylib 2>/dev/null || true
          chmod 755 /var/jb/Library/Application\ Support/*/*.bundle 2>/dev/null || true
          echo "Respring your device for changes to take effect."
          exit 0
          EOF
          chmod 755 ${{ env.TWEAK_NAME }}-rootless/DEBIAN/postinst
          
          # Build with compression
          case "${{ env.COMPRESSION }}" in
            "none")
              dpkg-deb -b -Znone ${{ env.TWEAK_NAME }}-rootless ${{ env.TWEAK_NAME }}_${{ env.VERSION }}_rootless_iphoneos-arm64.deb
              ;;
            "gzip")
              dpkg-deb -b -Zgzip ${{ env.TWEAK_NAME }}-rootless ${{ env.TWEAK_NAME }}_${{ env.VERSION }}_rootless_iphoneos-arm64.deb
              ;;
            "bzip2")
              dpkg-deb -b -Zbzip2 ${{ env.TWEAK_NAME }}-rootless ${{ env.TWEAK_NAME }}_${{ env.VERSION }}_rootless_iphoneos-arm64.deb
              ;;
            "xz")
              dpkg-deb -b -Zxz ${{ env.TWEAK_NAME }}-rootless ${{ env.TWEAK_NAME }}_${{ env.VERSION }}_rootless_iphoneos-arm64.deb
              ;;
            "zstd")
              dpkg-deb -b -Zzstd ${{ env.TWEAK_NAME }}-rootless ${{ env.TWEAK_NAME }}_${{ env.VERSION }}_rootless_iphoneos-arm64.deb
              ;;
            *)
              dpkg-deb -b ${{ env.TWEAK_NAME }}-rootless ${{ env.TWEAK_NAME }}_${{ env.VERSION }}_rootless_iphoneos-arm64.deb
              ;;
          esac

      - name: Build Rootful DEB
        run: |
          echo "📦 Building Rootful DEB with ${{ env.COMPRESSION }} compression..."
          
          mkdir -p ${{ env.TWEAK_NAME }}-rootful/DEBIAN
          mkdir -p ${{ env.TWEAK_NAME }}-rootful/Library/MobileSubstrate/DynamicLibraries
          mkdir -p "${{ env.TWEAK_NAME }}-rootful/Library/Application Support/${{ env.TWEAK_NAME }}"
          
          for dylib in dylib_extracted/*.dylib; do
            if [ -f "$dylib" ]; then
              cp "$dylib" ${{ env.TWEAK_NAME }}-rootful/Library/MobileSubstrate/DynamicLibraries/
            fi
          done
          
          for plist in *.plist; do
            if [ -f "$plist" ]; then
              cp "$plist" ${{ env.TWEAK_NAME }}-rootful/Library/MobileSubstrate/DynamicLibraries/
            fi
          done
          
          cp -r "${{ env.BUNDLE_DIR_NAME }}" "${{ env.TWEAK_NAME }}-rootful/Library/Application Support/${{ env.TWEAK_NAME }}/"
          
          cat > ${{ env.TWEAK_NAME }}-rootful/DEBIAN/control << EOF
          Package: ${{ env.PACKAGE_ID }}
          Name: ${{ env.TWEAK_NAME }}
          Version: ${{ env.VERSION }}
          Architecture: iphoneos-arm
          Description: ${{ env.DESCRIPTION }}
          Maintainer: ${{ env.MAINTAINER }}
          Section: Tweaks
          Depends: mobilesubstrate (>= 0.9.5000)
          EOF
          
          cat > ${{ env.TWEAK_NAME }}-rootful/DEBIAN/postinst << 'EOF'
          #!/bin/sh
          chmod 755 /Library/MobileSubstrate/DynamicLibraries/*.dylib 2>/dev/null || true
          chmod 755 /Library/Application\ Support/*/*.bundle 2>/dev/null || true
          echo "Respring your device for changes to take effect."
          exit 0
          EOF
          chmod 755 ${{ env.TWEAK_NAME }}-rootful/DEBIAN/postinst
          
          case "${{ env.COMPRESSION }}" in
            "none")
              dpkg-deb -b -Znone ${{ env.TWEAK_NAME }}-rootful ${{ env.TWEAK_NAME }}_${{ env.VERSION }}_iphoneos-arm.deb
              ;;
            "gzip")
              dpkg-deb -b -Zgzip ${{ env.TWEAK_NAME }}-rootful ${{ env.TWEAK_NAME }}_${{ env.VERSION }}_iphoneos-arm.deb
              ;;
            "bzip2")
              dpkg-deb -b -Zbzip2 ${{ env.TWEAK_NAME }}-rootful ${{ env.TWEAK_NAME }}_${{ env.VERSION }}_iphoneos-arm.deb
              ;;
            "xz")
              dpkg-deb -b -Zxz ${{ env.TWEAK_NAME }}-rootful ${{ env.TWEAK_NAME }}_${{ env.VERSION }}_iphoneos-arm.deb
              ;;
            "zstd")
              dpkg-deb -b -Zzstd ${{ env.TWEAK_NAME }}-rootful ${{ env.TWEAK_NAME }}_${{ env.VERSION }}_iphoneos-arm.deb
              ;;
            *)
              dpkg-deb -b ${{ env.TWEAK_NAME }}-rootful ${{ env.TWEAK_NAME }}_${{ env.VERSION }}_iphoneos-arm.deb
              ;;
          esac

      - name: Build Roothide DEB
        run: |
          echo "📦 Building Roothide DEB with ${{ env.COMPRESSION }} compression..."
          
          mkdir -p ${{ env.TWEAK_NAME }}-roothide/DEBIAN
          mkdir -p ${{ env.TWEAK_NAME }}-roothide/var/jb/Library/MobileSubstrate/DynamicLibraries
          mkdir -p "${{ env.TWEAK_NAME }}-roothide/var/jb/Library/Application Support/${{ env.TWEAK_NAME }}"
          
          for dylib in dylib_extracted/*.dylib; do
            if [ -f "$dylib" ]; then
              cp "$dylib" ${{ env.TWEAK_NAME }}-roothide/var/jb/Library/MobileSubstrate/DynamicLibraries/
            fi
          done
          
          for plist in *.plist; do
            if [ -f "$plist" ]; then
              cp "$plist" ${{ env.TWEAK_NAME }}-roothide/var/jb/Library/MobileSubstrate/DynamicLibraries/
            fi
          done
          
          cp -r "${{ env.BUNDLE_DIR_NAME }}" "${{ env.TWEAK_NAME }}-roothide/var/jb/Library/Application Support/${{ env.TWEAK_NAME }}/"
          
          cat > ${{ env.TWEAK_NAME }}-roothide/DEBIAN/control << EOF
          Package: ${{ env.PACKAGE_ID }}.roothide
          Name: ${{ env.TWEAK_NAME }} (Roothide)
          Version: ${{ env.VERSION }}
          Architecture: iphoneos-arm64e
          Description: ${{ env.DESCRIPTION }} - Roothide
          Maintainer: ${{ env.MAINTAINER }}
          Section: Tweaks
          Depends: ellekit (>= 1.0.0)
          EOF
          
          cat > ${{ env.TWEAK_NAME }}-roothide/DEBIAN/postinst << 'EOF'
          #!/bin/sh
          chmod 755 /var/jb/Library/MobileSubstrate/DynamicLibraries/*.dylib 2>/dev/null || true
          chmod 755 /var/jb/Library/Application\ Support/*/*.bundle 2>/dev/null || true
          echo "Respring your device for changes to take effect."
          exit 0
          EOF
          chmod 755 ${{ env.TWEAK_NAME }}-roothide/DEBIAN/postinst
          
          case "${{ env.COMPRESSION }}" in
            "none")
              dpkg-deb -b -Znone ${{ env.TWEAK_NAME }}-roothide ${{ env.TWEAK_NAME }}_${{ env.VERSION }}_roothide_iphoneos-arm64e.deb
              ;;
            "gzip")
              dpkg-deb -b -Zgzip ${{ env.TWEAK_NAME }}-roothide ${{ env.TWEAK_NAME }}_${{ env.VERSION }}_roothide_iphoneos-arm64e.deb
              ;;
            "bzip2")
              dpkg-deb -b -Zbzip2 ${{ env.TWEAK_NAME }}-roothide ${{ env.TWEAK_NAME }}_${{ env.VERSION }}_roothide_iphoneos-arm64e.deb
              ;;
            "xz")
              dpkg-deb -b -Zxz ${{ env.TWEAK_NAME }}-roothide ${{ env.TWEAK_NAME }}_${{ env.VERSION }}_roothide_iphoneos-arm64e.deb
              ;;
            "zstd")
              dpkg-deb -b -Zzstd ${{ env.TWEAK_NAME }}-roothide ${{ env.TWEAK_NAME }}_${{ env.VERSION }}_roothide_iphoneos-arm64e.deb
              ;;
            *)
              dpkg-deb -b ${{ env.TWEAK_NAME }}-roothide ${{ env.TWEAK_NAME }}_${{ env.VERSION }}_roothide_iphoneos-arm64e.deb
              ;;
          esac

      - name: Show file sizes
        run: |
          echo "📊 File size comparison:"
          echo ""
          echo "  Compression: ${{ env.COMPRESSION }}"
          echo ""
          for deb in *.deb; do
            SIZE=$(du -h "$deb" | cut -f1)
            echo "  📦 $deb: $SIZE"
          done

      - name: Create Release
        if: env.CREATE_RELEASE == 'true'
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ env.RELEASE_TAG }}
          name: ${{ env.TWEAK_NAME }} v${{ env.VERSION }}
          files: |
            ${{ env.TWEAK_NAME }}_${{ env.VERSION }}_iphoneos-arm.deb
            ${{ env.TWEAK_NAME }}_${{ env.VERSION }}_rootless_iphoneos-arm64.deb
            ${{ env.TWEAK_NAME }}_${{ env.VERSION }}_roothide_iphoneos-arm64e.deb
          body: ""
          generate_release_notes: false
          draft: false
          prerelease: false
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}