name: Build Jailbreak DEB (Ubuntu)

on:
  workflow_dispatch:
    inputs:
      tweak_name:
        description: 'Tweak name (e.g., YTKACE)'
        required: true
        default: 'YTKACE'
        type: string
      package_id:
        description: 'Package identifier (e.g., com.yourrepo.ytkace)'
        required: true
        default: 'com.dvntdm.ytlite'
        type: string
      version:
        description: 'Package version (e.g., 1.0.0)'
        required: true
        default: '5.2.2'
        type: string
      maintainer:
        description: 'Maintainer name'
        required: true
        default: 'ace'
        type: string
      description:
        description: 'Package description'
        required: true
        default: 'tweak for YouTube'
        type: string
      bundle_id:
        description: 'Bundle ID to inject into (e.g., com.google.ios.youtube)'
        required: true
        default: 'com.google.ios.youtube'
        type: string
      dylib_files:
        description: 'Space-separated list of dylib files or zips (e.g., YTKACE.dylib libYTKPlus.dylib.zip)'
        required: true
        default: ''
        type: string
      bundle_zip:
        description: 'Bundle zip filename (e.g., YTKACE.bundle.zip)'
        required: true
        default: ''
        type: string
      create_release:
        description: 'Create GitHub release?'
        required: true
        default: 'true'
        type: choice
        options:
          - 'true'
          - 'false'

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Install dependencies
        run: sudo apt-get update && sudo apt-get install -y dpkg-dev unzip

      - name: Check files exist
        run: |
          echo "📂 Checking files..."
          
          # Check each dylib file
          DYLIB_FILES="${{ github.event.inputs.dylib_files }}"
          for file in $DYLIB_FILES; do
            if [ -f "$file" ]; then
              echo "  ✅ $file exists"
            else
              echo "  ❌ $file NOT found!"
              ls -la
              exit 1
            fi
          done
          
          if [ -f "${{ github.event.inputs.bundle_zip }}" ]; then
            echo "  ✅ ${{ github.event.inputs.bundle_zip }} exists"
          else
            echo "  ❌ ${{ github.event.inputs.bundle_zip }} NOT found!"
            ls -la
            exit 1
          fi

      - name: Set environment variables
        run: |
          echo "TWEAK_NAME=${{ github.event.inputs.tweak_name }}" >> $GITHUB_ENV
          echo "PACKAGE_ID=${{ github.event.inputs.package_id }}" >> $GITHUB_ENV
          echo "VERSION=${{ github.event.inputs.version }}" >> $GITHUB_ENV
          echo "MAINTAINER=${{ github.event.inputs.maintainer }}" >> $GITHUB_ENV
          echo "DESCRIPTION=${{ github.event.inputs.description }}" >> $GITHUB_ENV
          echo "BUNDLE_ID=${{ github.event.inputs.bundle_id }}" >> $GITHUB_ENV
          echo "DYLIB_FILES=${{ github.event.inputs.dylib_files }}" >> $GITHUB_ENV
          echo "BUNDLE_ZIP=${{ github.event.inputs.bundle_zip }}" >> $GITHUB_ENV
          echo "CREATE_RELEASE=${{ github.event.inputs.create_release }}" >> $GITHUB_ENV
          echo "RELEASE_TAG=${{ github.event.inputs.tweak_name }}-${{ github.event.inputs.version }}" >> $GITHUB_ENV

      - name: Extract dylibs if zipped
        run: |
          echo "📦 Processing dylib files..."
          DYLIB_FILES="${{ env.DYLIB_FILES }}"
          EXTRACTED_DYLIB_NAMES=""
          DYLIB_COUNT=0
          
          mkdir -p dylib_extracted
          
          for file in $DYLIB_FILES; do
            # Check if it's a zip file
            if [[ "$file" == *.zip ]] || [[ "$file" == *.ZIP ]]; then
              echo "  Extracting zipped dylib: $file"
              unzip -q "$file" -d dylib_extracted/
              DYLIB_COUNT=$((DYLIB_COUNT + 1))
            else
              # It's a direct .dylib file - copy it to the extracted folder
              echo "  Using direct dylib: $file"
              cp "$file" dylib_extracted/
              DYLIB_COUNT=$((DYLIB_COUNT + 1))
            fi
          done
          
          # Get all dylib names (without path)
          for dylib in dylib_extracted/*.dylib; do
            if [ -f "$dylib" ]; then
              DYLIB_NAME=$(basename "$dylib")
              echo "  Found dylib: $DYLIB_NAME"
              if [ -z "$EXTRACTED_DYLIB_NAMES" ]; then
                EXTRACTED_DYLIB_NAMES="$DYLIB_NAME"
              else
                EXTRACTED_DYLIB_NAMES="$EXTRACTED_DYLIB_NAMES $DYLIB_NAME"
              fi
            fi
          done
          
          if [ -z "$EXTRACTED_DYLIB_NAMES" ]; then
            echo "  ❌ No dylib files found!"
            exit 1
          fi
          
          echo "EXTRACTED_DYLIB_NAMES=$EXTRACTED_DYLIB_NAMES" >> $GITHUB_ENV
          echo "DYLIB_COUNT=$DYLIB_COUNT" >> $GITHUB_ENV
          echo ""
          echo "📊 Total dylib files: $DYLIB_COUNT"

      - name: Generate main plist
        run: |
          echo "📦 Generating ${{ env.TWEAK_NAME }}.plist..."
          cat > ${{ env.TWEAK_NAME }}.plist << EOF
          <?xml version="1.0" encoding="UTF-8"?>
          <!DOCTYPE plist PUBLIC "-//Apple//DTD PLIST 1.0//EN" "http://www.apple.com/DTDs/PropertyList-1.0.dtd">
          <plist version="1.0">
          <dict>
              <key>Filter</key>
              <dict>
                  <key>Bundles</key>
                  <array>
                      <string>${{ env.BUNDLE_ID }}</string>
                  </array>
              </dict>
          </dict>
          </plist>
          EOF

      - name: Generate plists for each dylib
        run: |
          echo "📦 Generating plist files for each dylib..."
          PLIST_COUNT=0
          
          for dylib in dylib_extracted/*.dylib; do
            if [ -f "$dylib" ]; then
              DYLIB_NAME=$(basename "$dylib" .dylib)
              PLIST_FILE="${DYLIB_NAME}.plist"
              
              echo "  Generating: $PLIST_FILE"
              
              cat > "$PLIST_FILE" << EOF
          <?xml version="1.0" encoding="UTF-8"?>
          <!DOCTYPE plist PUBLIC "-//Apple//DTD PLIST 1.0//EN" "http://www.apple.com/DTDs/PropertyList-1.0.dtd">
          <plist version="1.0">
          <dict>
              <key>Filter</key>
              <dict>
                  <key>Bundles</key>
                  <array>
                      <string>${{ env.BUNDLE_ID }}</string>
                  </array>
              </dict>
          </dict>
          </plist>
          EOF
              
              PLIST_COUNT=$((PLIST_COUNT + 1))
            fi
          done
          
          echo "PLIST_COUNT=$PLIST_COUNT" >> $GITHUB_ENV

      - name: Extract bundle zip
        run: |
          echo "📦 Extracting bundle zip..."
          BUNDLE_ZIP="${{ env.BUNDLE_ZIP }}"
          
          # Extract the bundle zip
          unzip -q "$BUNDLE_ZIP" -d .
          
          # Find the extracted .bundle directory
          EXTRACTED_BUNDLE=$(find . -maxdepth 2 -type d -name "*.bundle" ! -path "./.*" | head -1)
          
          if [ -n "$EXTRACTED_BUNDLE" ]; then
            BUNDLE_DIR_NAME=$(basename "$EXTRACTED_BUNDLE")
            echo "  ✅ Found bundle: $BUNDLE_DIR_NAME"
            echo "BUNDLE_DIR_NAME=$BUNDLE_DIR_NAME" >> $GITHUB_ENV
          else
            echo "  ⚠️  No .bundle found after extraction!"
            echo "  Contents of current directory:"
            ls -la
            exit 1
          fi

      - name: Build Rootful DEB
        run: |
          echo "📦 Building Rootful DEB..."
          
          mkdir -p ${{ env.TWEAK_NAME }}-rootful/DEBIAN
          mkdir -p ${{ env.TWEAK_NAME }}-rootful/Library/MobileSubstrate/DynamicLibraries
          mkdir -p "${{ env.TWEAK_NAME }}-rootful/Library/Application Support/${{ env.TWEAK_NAME }}"
          
          # Copy all dylib files
          for dylib in dylib_extracted/*.dylib; do
            if [ -f "$dylib" ]; then
              cp "$dylib" ${{ env.TWEAK_NAME }}-rootful/Library/MobileSubstrate/DynamicLibraries/
              echo "  ✅ Copied: $(basename "$dylib")"
            fi
          done
          
          # Copy all plist files
          for plist in *.plist; do
            if [ -f "$plist" ]; then
              cp "$plist" ${{ env.TWEAK_NAME }}-rootful/Library/MobileSubstrate/DynamicLibraries/
              echo "  ✅ Copied: $plist"
            fi
          done
          
          cp -r "${{ env.BUNDLE_DIR_NAME }}" "${{ env.TWEAK_NAME }}-rootful/Library/Application Support/${{ env.TWEAK_NAME }}/"
          
          cat > ${{ env.TWEAK_NAME }}-rootful/DEBIAN/control << EOF
          Package: ${{ env.PACKAGE_ID }}
          Name: ${{ env.TWEAK_NAME }}
          Version: ${{ env.VERSION }}
          Architecture: iphoneos-arm
          Description: ${{ env.DESCRIPTION }}
          Maintainer: ${{ env.MAINTAINER }}
          Section: Tweaks
          Depends: mobilesubstrate
          EOF
          
          dpkg-deb -b ${{ env.TWEAK_NAME }}-rootful ${{ env.TWEAK_NAME }}_${{ env.VERSION }}_iphoneos-arm.deb

      - name: Build Rootless DEB
        run: |
          echo "📦 Building Rootless DEB..."
          
          mkdir -p ${{ env.TWEAK_NAME }}-rootless/DEBIAN
          mkdir -p ${{ env.TWEAK_NAME }}-rootless/var/jb/Library/MobileSubstrate/DynamicLibraries
          mkdir -p "${{ env.TWEAK_NAME }}-rootless/var/jb/Library/Application Support/${{ env.TWEAK_NAME }}"
          
          # Copy all dylib files
          for dylib in dylib_extracted/*.dylib; do
            if [ -f "$dylib" ]; then
              cp "$dylib" ${{ env.TWEAK_NAME }}-rootless/var/jb/Library/MobileSubstrate/DynamicLibraries/
              echo "  ✅ Copied: $(basename "$dylib")"
            fi
          done
          
          # Copy all plist files
          for plist in *.plist; do
            if [ -f "$plist" ]; then
              cp "$plist" ${{ env.TWEAK_NAME }}-rootless/var/jb/Library/MobileSubstrate/DynamicLibraries/
              echo "  ✅ Copied: $plist"
            fi
          done
          
          cp -r "${{ env.BUNDLE_DIR_NAME }}" "${{ env.TWEAK_NAME }}-rootless/var/jb/Library/Application Support/${{ env.TWEAK_NAME }}/"
          
          cat > ${{ env.TWEAK_NAME }}-rootless/DEBIAN/control << EOF
          Package: ${{ env.PACKAGE_ID }}.rootless
          Name: ${{ env.TWEAK_NAME }} (Rootless)
          Version: ${{ env.VERSION }}
          Architecture: iphoneos-arm64
          Description: ${{ env.DESCRIPTION }} - Rootless
          Maintainer: ${{ env.MAINTAINER }}
          Section: Tweaks
          Depends: mobilesubstrate
          EOF
          
          dpkg-deb -b ${{ env.TWEAK_NAME }}-rootless ${{ env.TWEAK_NAME }}_${{ env.VERSION }}_rootless_iphoneos-arm64.deb

      - name: Build Roothide DEB
        run: |
          echo "📦 Building Roothide DEB..."
          
          mkdir -p ${{ env.TWEAK_NAME }}-roothide/DEBIAN
          mkdir -p ${{ env.TWEAK_NAME }}-roothide/var/jb/Library/MobileSubstrate/DynamicLibraries
          mkdir -p "${{ env.TWEAK_NAME }}-roothide/var/jb/Library/Application Support/${{ env.TWEAK_NAME }}"
          
          # Copy all dylib files
          for dylib in dylib_extracted/*.dylib; do
            if [ -f "$dylib" ]; then
              cp "$dylib" ${{ env.TWEAK_NAME }}-roothide/var/jb/Library/MobileSubstrate/DynamicLibraries/
              echo "  ✅ Copied: $(basename "$dylib")"
            fi
          done
          
          # Copy all plist files
          for plist in *.plist; do
            if [ -f "$plist" ]; then
              cp "$plist" ${{ env.TWEAK_NAME }}-roothide/var/jb/Library/MobileSubstrate/DynamicLibraries/
              echo "  ✅ Copied: $plist"
            fi
          done
          
          cp -r "${{ env.BUNDLE_DIR_NAME }}" "${{ env.TWEAK_NAME }}-roothide/var/jb/Library/Application Support/${{ env.TWEAK_NAME }}/"
          
          cat > ${{ env.TWEAK_NAME }}-roothide/DEBIAN/control << EOF
          Package: ${{ env.PACKAGE_ID }}.roothide
          Name: ${{ env.TWEAK_NAME }} (Roothide)
          Version: ${{ env.VERSION }}
          Architecture: iphoneos-arm64e
          Description: ${{ env.DESCRIPTION }} - Roothide
          Maintainer: ${{ env.MAINTAINER }}
          Section: Tweaks
          Depends: ellekit (>= 1.0.0)
          EOF
          
          dpkg-deb -b ${{ env.TWEAK_NAME }}-roothide ${{ env.TWEAK_NAME }}_${{ env.VERSION }}_roothide_iphoneos-arm64e.deb

      - name: List built packages
        run: |
          echo "📦 Built packages:"
          ls -la *.deb
          echo ""
          echo "📊 Package statistics:"
          echo "  - Tweak: ${{ env.TWEAK_NAME }}"
          echo "  - Version: ${{ env.VERSION }}"
          echo "  - Release Tag: ${{ env.RELEASE_TAG }}"
          echo "  - Dylib count: ${{ env.DYLIB_COUNT }}"
          echo "  - Plist count: ${{ env.PLIST_COUNT }}"
          echo "  - Bundle dir: ${{ env.BUNDLE_DIR_NAME }}"
          echo ""
          echo "  📱 Rootful: ${{ env.TWEAK_NAME }}_${{ env.VERSION }}_iphoneos-arm.deb"
          echo "  📱 Rootless: ${{ env.TWEAK_NAME }}_${{ env.VERSION }}_rootless_iphoneos-arm64.deb"
          echo "  📱 Roothide: ${{ env.TWEAK_NAME }}_${{ env.VERSION }}_roothide_iphoneos-arm64e.deb"

      - name: Create Release
        if: env.CREATE_RELEASE == 'true'
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ env.RELEASE_TAG }}
          name: ${{ env.TWEAK_NAME }} v${{ env.VERSION }}
          files: |
            ${{ env.TWEAK_NAME }}_${{ env.VERSION }}_iphoneos-arm.deb
            ${{ env.TWEAK_NAME }}_${{ env.VERSION }}_rootless_iphoneos-arm64.deb
            ${{ env.TWEAK_NAME }}_${{ env.VERSION }}_roothide_iphoneos-arm64e.deb
          body: ""
          generate_release_notes: false
          draft: false
          prerelease: false
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}